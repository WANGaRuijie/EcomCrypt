name: Stage Scholar Directory update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Write the review report only
        type: boolean
        default: true
      enable_llm:
        description: Enable optional topic suggestions (up to US $1 per run)
        type: boolean
        default: false
      publish:
        description: Request promotion and Pages publication if this repository has opted in
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ vars.SCHOLAR_AUTO_PUBLISH == 'true' && vars.SCHOLAR_PAGES_REPOSITORY == github.repository &&
    (github.event_name == 'schedule' || (inputs.publish && !inputs.dry_run)) &&
    'scholar-directory-pages' || 'scholar-directory-update' }}
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_new: ${{ steps.preview.outputs.has_new }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests
      - name: Restore optional topic cache
        if: github.event_name == 'workflow_dispatch' && inputs.enable_llm
        uses: actions/cache@v6
        with:
          path: .cache/scholar-update/llm
          key: scholar-llm-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scholar-llm-v1-
      - name: Screen and verify candidate works
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          OPENAI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_llm && secrets.OPENAI_API_KEY || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ENABLE_LLM: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_llm }}
        run: |
          args=(--discover)
          if [[ "$DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          if [[ "$ENABLE_LLM" == 'true' ]]; then args+=(--enable-llm); fi
          python scripts/update.py "${args[@]}"
      - name: Upload decision report
        uses: actions/upload-artifact@v7
        with:
          name: scholar-update-review-${{ github.run_attempt }}
          path: .out/update/report.json
          if-no-files-found: error
      - name: Build standalone Pages preview
        id: preview
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          release=$(python -c 'import json; print(json.load(open(".out/update/current.json"))["release"])')
          cp -R site .out/update/pages
          cp ".out/update/$release/directory.json" .out/update/directory.json
          cp .out/update/directory.json .out/update/pages/data/directory.json
          cp ".out/update/$release/accepted_updates_v1.json" .out/update/accepted_updates_v1.json
          tar -czf .out/update/scholar-pages.tar.gz -C .out/update/pages .
          python -c 'import json; print("has_new=" + str(json.load(open(".out/update/report.json"))["counts"].get("accepted", 0) > 0).lower())' >> "$GITHUB_OUTPUT"
      - name: Upload Pages preview
        id: artifact
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: scholar-pages-preview-${{ github.run_attempt }}
          path: |
            .out/update/scholar-pages.tar.gz
            .out/update/accepted_updates_v1.json
            .out/update/directory.json
            .out/update/report.json
          if-no-files-found: error

  promote:
    needs: stage
    if: >-
      needs.stage.outputs.has_new == 'true' &&
      vars.SCHOLAR_AUTO_PUBLISH == 'true' && vars.SCHOLAR_PAGES_REPOSITORY == github.repository &&
      github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch &&
      !endsWith(github.event.repository.name, '.github.io') &&
      (github.event_name == 'schedule' || (inputs.publish && !inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    environment: scholar-promotion
    outputs:
      pages_artifact: ${{ steps.push.outputs.pages_artifact }}
    steps:
      - name: Require approval in the protected promotion environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          configured=$(gh api "repos/$GITHUB_REPOSITORY/environments/scholar-promotion" \
            --jq 'any(.protection_rules[]?; .type == "required_reviewers" and ((.reviewers // []) | length > 0))')
          approved=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq 'any(.[]; .state == "approved" and any(.environments[]?; .name == "scholar-promotion"))')
          if [[ "$configured" != 'true' || "$approved" != 'true' ]]; then
            echo 'A required reviewer must approve this run in the scholar-promotion environment.' >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.stage.outputs.artifact_id }}
          path: .out/promotion
      - name: Validate the append-only promotion against the committed baseline
        run: |
          python scripts/build.py check
          python - <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return json.loads(path.read_text(encoding="utf-8"))

          baseline = Path("data/accepted_updates_v1.json")
          staged = Path(".out/promotion")
          prior = read(baseline)["records"] if baseline.exists() else []
          ledger = read(staged / "accepted_updates_v1.json")
          records = ledger["records"]
          report = read(staged / "report.json")
          additions = records[len(prior):]
          accepted = [row for row in report["decisions"] if row["status"] == "accepted"]
          if (
              report["mode"] != "live" or report["dry_run"] is not False
              or ledger["schema_version"] != 1 or records[:len(prior)] != prior
              or not additions
              or [row["work_id"] for row in additions] != [row["paper_id"] for row in accepted]
              or any(
                  entry["raw_input"] != decision["input"]
                  or entry["verification"] != decision["verification"]
                  or not set(entry["topic_ids"]) <= set(decision["rule_topic_ids"])
                  for entry, decision in zip(additions, accepted)
              )
          ):
              raise SystemExit("Promotion is not an append-only live update of the checked-out baseline.")
          PY
          python scripts/build.py check \
            --ledger .out/promotion/accepted_updates_v1.json --output .out/promotion/directory.json
          cp .out/promotion/accepted_updates_v1.json data/accepted_updates_v1.json
          cp .out/promotion/directory.json site/data/directory.json
          test -s site/index.html
      - name: Upload the validated site for deployment
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site/
      - name: Commit and fast-forward the default branch
        id: push
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote=$(git ls-remote --exit-code --symref origin HEAD)
          remote_ref=$(awk '$1 == "ref:" { print $2 }' <<< "$remote")
          remote_head=$(awk '$2 == "HEAD" { print $1 }' <<< "$remote")
          if [[ "$remote_ref" != "$GITHUB_REF" || "$remote_head" != "$GITHUB_SHA" ]]; then
            echo 'The default branch moved. Start a new Scholar Directory update.' >&2
            exit 1
          fi
          git add -- data/accepted_updates_v1.json site/data/directory.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update Scholar Directory data'
          git push origin "HEAD:$GITHUB_REF"
          echo "pages_artifact=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the promoted directory to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.promote.outputs.pages_artifact }}
